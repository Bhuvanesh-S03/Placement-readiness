<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlacementIQ</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f4f6fb;color:#222}
  header{background:#1f3a8a;color:#fff;padding:16px 24px;font-size:20px}
  .wrap{max-width:900px;margin:20px auto;padding:0 16px}
  .tabs button{padding:10px 18px;border:0;background:#dbe3ff;cursor:pointer;margin-right:4px;border-radius:6px 6px 0 0}
  .tabs button.active{background:#fff;font-weight:bold}
  .card{background:#fff;padding:20px;border-radius:0 8px 8px 8px;box-shadow:0 1px 4px #0002}
  input,button.go{padding:8px;margin:4px 4px 4px 0;border:1px solid #bbb;border-radius:5px}
  button.go{background:#1f3a8a;color:#fff;border:0;cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
  th{background:#eef1fb}
  .hidden{display:none}
  #chatbox{background:#f7f7f7;border:1px solid #ddd;height:220px;overflow:auto;padding:10px;margin-top:10px;border-radius:6px}
  .me{color:#1f3a8a}.bot{color:#065f46;margin-bottom:8px}
  pre{white-space:pre-wrap}
</style>
</head>
<body>
<header>PlacementIQ – Placement Readiness Analytics</header>
<div class="wrap">
  <div class="tabs">
    <button id="t1" class="active" onclick="show('faculty')">Faculty</button>
    <button id="t2" onclick="show('student')">Student</button>
  </div>

  <div class="card" id="faculty">
    <h3>Add / update student</h3>
    <input id="f_id" placeholder="Student ID (STU051)">
    <input id="f_name" placeholder="Name">
    <input id="f_email" placeholder="Email">
    <input id="f_apt" type="number" placeholder="Aptitude 0-100">
    <input id="f_cod" type="number" placeholder="Coding 0-100">
    <input id="f_int" type="number" placeholder="Interview 0-100">
    <button class="go" onclick="addStudent()">Save</button>
    <p id="f_msg"></p>
    <h3>All students</h3>
    <button class="go" onclick="loadStudents()">Load / refresh</button>
    <table id="tbl"></table>
  </div>

  <div class="card hidden" id="student">
    <h3>My readiness</h3>
    <input id="s_id" placeholder="Your Student ID (e.g. STU001)">
    <button class="go" onclick="getReadiness()">Check</button>
    <pre id="s_out"></pre>
    <h3>Ask the placement assistant</h3>
    <div id="chatbox"></div>
    <input id="q" style="width:70%" placeholder="Am I ready for product companies?">
    <button class="go" onclick="ask()">Ask</button>
  </div>
</div>

<script>
// >>> PASTE YOUR API GATEWAY INVOKE URL HERE (no trailing slash), e.g. https://abc123.execute-api.us-east-1.amazonaws.com/prod
const API = "PASTE_YOUR_INVOKE_URL_HERE";

function show(which){
  document.getElementById("faculty").classList.toggle("hidden", which!=="faculty");
  document.getElementById("student").classList.toggle("hidden", which!=="student");
  document.getElementById("t1").classList.toggle("active", which==="faculty");
  document.getElementById("t2").classList.toggle("active", which==="student");
}
const $ = id => document.getElementById(id);

async function addStudent(){
  const body = {studentId:$("f_id").value.trim(), name:$("f_name").value, email:$("f_email").value,
    aptitude:$("f_apt").value, coding:$("f_cod").value, interview:$("f_int").value};
  const r = await fetch(API+"/ingest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json();
  $("f_msg").textContent = j.message || j.error;
}

async function loadStudents(){
  const j = await (await fetch(API+"/students")).json();
  let h = "<tr><th>ID</th><th>Name</th><th>Apt</th><th>Code</th><th>Int</th><th>Score</th><th>Category</th></tr>";
  j.students.forEach(s=>{
    h += `<tr><td>${s.studentId}</td><td>${s.name}</td><td>${s.aptitude}</td><td>${s.coding}</td><td>${s.interview}</td><td>${s.readiness_score}</td><td>${s.category}</td></tr>`;
  });
  $("tbl").innerHTML = h;
}

async function getReadiness(){
  const id = $("s_id").value.trim();
  const r = await fetch(API+"/readiness/"+id);
  const j = await r.json();
  if(!r.ok){ $("s_out").textContent = j.error; return; }
  $("s_out").textContent =
`Name: ${j.name}
Readiness score: ${j.readiness_score}  (${j.category})
Strength: ${j.strength}    Weak area: ${j.weak_area}
Suggestion: ${j.suggestion}
Recommended companies: ${j.recommended_companies.join(", ")}`;
}

async function ask(){
  const id = $("s_id").value.trim(), q = $("q").value.trim();
  if(!id || !q) return alert("Enter your Student ID above and a question");
  $("chatbox").innerHTML += `<div class="me"><b>You:</b> ${q}</div>`;
  const r = await fetch(API+"/assistant",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({studentId:id, question:q})});
  const j = await r.json();
  $("chatbox").innerHTML += `<div class="bot"><b>Assistant:</b> ${j.answer || j.error}</div>`;
  $("chatbox").scrollTop = $("chatbox").scrollHeight;
  $("q").value = "";
}
</script>
</body>
</html>
